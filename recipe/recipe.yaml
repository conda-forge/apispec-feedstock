schema_version: 1

context:
  name: apispec
  version: "6.10.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apispec-${{ version }}.tar.gz
  sha256: 46896cb0cab23b4e853e528528937719739f836358832bb8610edd14db1d9c01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <5
  run:
    - python >=${{ python_min }}
    - packaging >=21.3
    # from the yaml extra
    # yaml extra:
    - pyyaml >=3.10
tests:
  - python:
      imports:
        - apispec
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: A pluggable API specification generator
  description: |
    A pluggable API specification generator. Currently supports the OpenAPI
    specification (f.k.a. Swagger 2.0).
  homepage: https://github.com/marshmallow-code/apispec
  repository: https://github.com/marshmallow-code/apispec
  documentation: http://apispec.readthedocs.io/

extra:
  recipe-maintainers:
    - xylar
    - carlodri
